<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddy's Game - Ninja Castle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-size: 4rem;
            color: #e94560;
            text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
            margin-bottom: 2rem;
            font-weight: bold;
            letter-spacing: 0.2em;
        }

        .loading-subtitle {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .loading-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #e94560;
        }

        .loading-text {
            margin-top: 1rem;
            color: #fff;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 100;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .player-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .stat-bar-bg {
            width: 200px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .stat-bar-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .health-fill {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            box-shadow: 0 0 10px #e94560 inset;
        }

        .stamina-fill {
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            box-shadow: 0 0 10px #4ecdc4 inset;
        }

        .stat-value {
            color: #fff;
            font-size: 0.9rem;
            min-width: 60px;
            text-shadow: 1px 1px 2px #000;
        }

        .game-info {
            text-align: right;
            color: #fff;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .wave-info {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .enemy-count {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }

        .crosshair-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(255,255,255,0.6);
        }

        .crosshair-line.top {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
        }

        .crosshair-line.bottom {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
        }

        .crosshair-line.left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 2px;
        }

        .crosshair-line.right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 2px;
        }

        #controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            opacity: 0.6;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 100;
        }

        .controls-row {
            margin: 5px 0;
        }

        kbd {
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 4px;
            margin: 0 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            overflow: hidden;
            z-index: 100;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        #damage-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(233,69,96,0) 50%, rgba(233,69,96,0.3) 100%);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        #ability-bar {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .ability-slot {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ability-icon {
            font-size: 1.5rem;
        }

        .ability-key {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
        }

        .ability-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            border-radius: 6px;
            opacity: 0;
        }

        .ability-slot.on-cooldown .ability-cooldown {
            opacity: 1;
        }

        #notification {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000, 0 0 20px #e94560;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        #pause-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #pause-menu.visible {
            display: flex;
        }

        .pause-title {
            font-size: 3rem;
            color: #e94560;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #e94560;
        }

        .menu-button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border: none;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }

        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233,69,96,0.5);
        }

        #quality-toggle {
            position: fixed;
            top: 20px;
            right: 180px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 101;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        #quality-toggle:hover {
            background: rgba(233,69,96,0.4);
            border-color: #e94560;
        }

        #quality-toggle .quality-label {
            opacity: 0.7;
            font-size: 0.75rem;
        }

        #quality-toggle .quality-value {
            font-weight: bold;
            color: #4ecdc4;
        }

        #fps-counter {
            position: fixed;
            top: 60px;
            right: 180px;
            background: rgba(0,0,0,0.4);
            color: #4ecdc4;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            z-index: 101;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-title">FREDDY'S GAME</div>
        <div class="loading-subtitle">Shadows of the Ninja Castle</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Initializing...</div>
    </div>

    <div id="game-container"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="player-stats">
                <div class="stat-bar">
                    <div class="stat-icon">❤️</div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill health-fill" id="health-bar" style="width: 100%"></div>
                    </div>
                    <div class="stat-value" id="health-value">100/100</div>
                </div>
                <div class="stat-bar">
                    <div class="stat-icon">⚡</div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill stamina-fill" id="stamina-bar" style="width: 100%"></div>
                    </div>
                    <div class="stat-value" id="stamina-value">100/100</div>
                </div>
            </div>
            <div class="game-info">
                <div class="score" id="score">Score: 0</div>
                <div class="wave-info" id="wave-info">Wave 1</div>
                <div class="enemy-count" id="enemy-count">Enemies: 0</div>
            </div>
        </div>
    </div>

    <div id="crosshair">
        <div class="crosshair-dot"></div>
        <div class="crosshair-line top"></div>
        <div class="crosshair-line bottom"></div>
        <div class="crosshair-line left"></div>
        <div class="crosshair-line right"></div>
    </div>

    <div id="ability-bar">
        <div class="ability-slot" id="ability-1">
            <div class="ability-icon">⚔️</div>
            <div class="ability-key">1</div>
            <div class="ability-cooldown">0</div>
        </div>
        <div class="ability-slot" id="ability-2">
            <div class="ability-icon">🌀</div>
            <div class="ability-key">2</div>
            <div class="ability-cooldown">0</div>
        </div>
        <div class="ability-slot" id="ability-3">
            <div class="ability-icon">💨</div>
            <div class="ability-key">3</div>
            <div class="ability-cooldown">0</div>
        </div>
        <div class="ability-slot" id="ability-4">
            <div class="ability-icon">🔥</div>
            <div class="ability-key">4</div>
            <div class="ability-cooldown">0</div>
        </div>
    </div>

    <div id="controls-hint">
        <div class="controls-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move | <kbd>SHIFT</kbd> Sprint | <kbd>SPACE</kbd> Jump</div>
        <div class="controls-row"><kbd>LMB</kbd> Attack | <kbd>RMB</kbd> Block | <kbd>1-4</kbd> Abilities | <kbd>ESC</kbd> Pause</div>
    </div>

    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>

    <div id="damage-overlay"></div>

    <div id="notification"></div>

    <button id="quality-toggle">
        <span class="quality-label">Quality:</span>
        <span class="quality-value" id="quality-value">High</span>
    </button>

    <div id="fps-counter">FPS: --</div>

    <div id="pause-menu">
        <div class="pause-title">PAUSED</div>
        <button class="menu-button" id="resume-btn">Resume</button>
        <button class="menu-button" id="restart-btn">Restart</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
